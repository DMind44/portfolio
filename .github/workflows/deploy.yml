name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/dmind44/portfolio:latest
            ghcr.io/dmind44/portfolio:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: ssh deploy (git pull + compose rollout)
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 600 /dev/null id_deploy
          echo "$KEY" > id_deploy
          ssh -i id_deploy -o StrictHostKeyChecking=accept-new \
            "$USER@$HOST" \
            'cd ~/portfolio && git pull --ff-only && docker compose pull && docker compose up -d'
      - name: cleanup key
        if: always()
        run: rm -f id_deploy
