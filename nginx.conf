server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # content-hashed assets built by nuxt generate — cache forever
  location /_nuxt/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /_ipx/  { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # HTML always revalidates so a deploy is visible on the next reload
  location ~* \.html$ { add_header Cache-Control "no-cache"; }

  # every route is prerendered as <route>/index.html
  location / {
    try_files $uri $uri/ =404;
  }
}
